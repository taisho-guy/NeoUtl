[package]
name = "neo-media-transfer-d3d11"
version = "0.0.0"
edition = "2024"

[dependencies]
neo-media-core = { path = "../neo-media-core" }
ffmpeg-sys-next = { version = "9", features = ["swscale"] }
wgpu = { version = "30" }
wgpu-hal = { version = "30", features = ["dx12"] }
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_System_Threading",
] }
bytemuck = { version = "1", features = ["derive"] }

[build-dependencies]
neoutl-object-shader-build.workspace = true
