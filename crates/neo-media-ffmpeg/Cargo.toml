[package]
name = "neo-media-ffmpeg"
version = "0.0.0"
edition = "2024"

[dependencies]
neoutl-media-api.workspace = true
neoutl-color.workspace = true
neo-media-core = { path = "../neo-media-core" }
neo-media-cache = { path = "../neo-media-cache" }
neo-media-support = { path = "../neo-media-support" }
neo-media-swscale.workspace = true
bytemuck.workspace = true
ffmpeg-sys-next = { version = "9", features = ["swscale"] }
libc = "0.2"
wgpu = { workspace = true, features = ["vulkan-portability"] }

[build-dependencies]
neoutl-object-shader-build.workspace = true
