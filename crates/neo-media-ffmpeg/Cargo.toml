[package]
name = "neo-media-ffmpeg"
version = "0.0.0"
edition = "2024"

[dependencies]
neoutl-media-api = { path = "../neoutl-media-api" }
neoutl-color = { path = "../neoutl-color" }
neo-media-core = { path = "../neo-media-core" }
neo-media-cache = { path = "../neo-media-cache" }
neo-media-support = { path = "../neo-media-support" }
bytemuck = "1"
ffmpeg-next = { version = "9", features = ["codec", "format", "software-resampling"] }
ffmpeg-sys-next = { version = "9", features = ["swscale"] }
libc = "0.2"
wgpu = { version = "30", features = ["vulkan-portability"] }

[target.'cfg(target_os = "linux")'.dependencies]
neo-media-transfer-vaapi = { path = "../neo-media-transfer-vaapi" }
libva = { package = "cros-libva-extended", version = "=0.0.13-extended.2" }

[target.'cfg(target_os = "windows")'.dependencies]
neo-media-transfer-d3d11 = { path = "../neo-media-transfer-d3d11" }
