[package]
name    = "neoutl-lua-runtime"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
rust-i18n.workspace = true
neoutl-shared-abi.workspace = true
neoutl-effect-lua.workspace = true
mlua.workspace = true

[features]
default = ["luajit"]
luajit = ["mlua/luajit"]
lua54 = ["mlua/lua54"]
