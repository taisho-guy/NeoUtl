syntax = "proto3";
package neoutl.v1;

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_GLOBAL = 1;
  SCOPE_TIMELINE = 2;
  SCOPE_PROPERTIES = 3;
  SCOPE_PREVIEW = 4;
}

enum CommandId {
  COMMAND_ID_UNSPECIFIED = 0;
  COMMAND_ID_NEW_PROJECT = 1;
  COMMAND_ID_OPEN_PROJECT = 2;
  COMMAND_ID_SAVE_PROJECT = 3;
  COMMAND_ID_SAVE_PROJECT_AS = 4;
  COMMAND_ID_EXPORT_MEDIA = 5;
  COMMAND_ID_QUIT = 6;
  COMMAND_ID_UNDO = 7;
  COMMAND_ID_REDO = 8;
  COMMAND_ID_TOGGLE_PLAY = 9;
  COMMAND_ID_STEP_FRAME_FWD = 10;
  COMMAND_ID_STEP_FRAME_BACK = 11;
  COMMAND_ID_SEEK_HOME = 12;
  COMMAND_ID_SEEK_END = 13;
  COMMAND_ID_SHOW_TIMELINE = 14;
  COMMAND_ID_SHOW_PROPERTIES = 15;
  COMMAND_ID_SHOW_PREVIEW = 16;
  COMMAND_ID_SHOW_SYSTEM_SETTINGS = 17;
  COMMAND_ID_SHOW_PROJECT_SETTINGS = 18;
  COMMAND_ID_SHOW_SCENE_SETTINGS = 19;
  COMMAND_ID_SHOW_KEYBINDINGS = 20;
  COMMAND_ID_NEXT_PROJECT_TAB = 21;
  COMMAND_ID_PREV_PROJECT_TAB = 22;
  COMMAND_ID_CLOSE_PROJECT_TAB = 23;
  COMMAND_ID_NEW_SCENE = 24;
  COMMAND_ID_CLOSE_SCENE = 25;
  COMMAND_ID_NEXT_SCENE = 26;
  COMMAND_ID_PREV_SCENE = 27;
  COMMAND_ID_DELETE_SELECTED = 28;
  COMMAND_ID_SPLIT_AT_PLAYHEAD = 29;
  COMMAND_ID_DUPLICATE = 30;
  COMMAND_ID_CUT = 31;
  COMMAND_ID_COPY = 32;
  COMMAND_ID_PASTE = 33;
  COMMAND_ID_TOGGLE_RIPPLE = 34;
  COMMAND_ID_ZOOM_IN = 35;
  COMMAND_ID_ZOOM_OUT = 36;
}

message OwnedBinding {
  bool ctrl = 1;
  bool shift = 2;
  bool alt = 3;
  string key = 4;
}

message Override {
  CommandId command = 1;
  Scope scope = 2;
  OwnedBinding binding = 3;
}

message KeymapResource {
  repeated Override overrides = 1;
}
