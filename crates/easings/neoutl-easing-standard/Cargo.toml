[package]
name = "neoutl-easing-standard"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
neoutl-easing-api = { path = "../../neoutl-easing-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
] }

[build-dependencies]
slint-build = "1.17"
