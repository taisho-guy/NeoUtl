[package]
name = "neo-media-transfer-vaapi"
version = "0.0.0"
edition = "2024"

[dependencies]
neo-media-core = { path = "../neo-media-core" }
ffmpeg-sys-next = { version = "9", features = ["swscale"] }
wgpu = { version = "30", features = ["vulkan-portability"] }
wgpu-hal = { version = "30", features = ["vulkan"] }
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }

[build-dependencies]
neoutl-object-shader-build.workspace = true
cc = "1"
pkg-config = "0.3"
