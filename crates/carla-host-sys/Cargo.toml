[package]
name = "carla-host-sys"
version = "0.1.0"
edition = "2024"
description = "Rust FFI and safe host bindings for the Carla audio plugin host backend"
license = "GPL-2.0-or-later"

[dependencies]
thiserror = "2"
egui = { version = "0.35", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = []
egui = ["dep:egui", "dep:raw-window-handle"]

[build-dependencies]
cmake = "0.1"
bindgen = "0.72"
