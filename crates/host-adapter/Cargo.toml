[package]
name = "maolan-host-adapter"
version = "0.1.0"
edition = "2024"
description = "NeoUtl adapter over maolan-plugin-host out-of-process CLAP/VST3/LV2 hosting"
license = "BSD-2-Clause"

[dependencies]
maolan-plugin-host = "0.0.7"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dirs = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
