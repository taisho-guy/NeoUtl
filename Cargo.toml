[package]
name = "NeoUtl"
version = "0.8.7"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/core/schema",
    "crates/core/shared-abi",
    "crates/core/color",
    "crates/object/api",
    "crates/effect/api",
    "crates/effect/lua",
    "crates/lua-runtime",
    "crates/easing/api",
    "crates/expression/api",
    "crates/easing/standard",
    "crates/object/plugins/*",
    "crates/effect/plugins/*",
    "crates/media/api",
    "crates/media/runtime",
    "crates/media/mlt-api",
    "crates/media/decoders/symphonia",
    "crates/media/decoders/image",
    "crates/media/core",
    "crates/media/cache",
    "crates/media/support",
    "crates/media/swscale",
    "crates/media/ffmpeg",
    "crates/effect/shader-build",
    "crates/object/shader-build",
    "xtask",
    "crates/host-adapter",
    "sdk/neoutl/0.8.7/rust",
]
resolver = "2"

[workspace.dependencies]
maolan-host-adapter = { path = "crates/host-adapter" }
neoutl-shared-abi = { path = "crates/core/shared-abi" }
neoutl-color = { path = "crates/core/color" }
neoutl-object-api = { path = "crates/object/api" }
neoutl-effect-api = { path = "crates/effect/api" }
neoutl-effect-lua = { path = "crates/effect/lua" }
neoutl-lua-runtime = { path = "crates/lua-runtime" }
neoutl-easing-api = { path = "crates/easing/api" }
neoutl-expression-api = { path = "crates/expression/api" }
neoutl-media-api = { path = "crates/media/api" }
neoutl-media-runtime = { path = "crates/media/runtime" }
neoutl-mlt-api = { path = "crates/media/mlt-api" }
neoutl-easing-standard = { path = "crates/easing/standard" }
neoutl-effect-shader-build = { path = "crates/effect/shader-build" }
neoutl-object-shader-build = { path = "crates/object/shader-build" }
neo-media-core = { path = "crates/media/core" }
neo-media-cache = { path = "crates/media/cache" }
neo-media-support = { path = "crates/media/support" }
neo-media-swscale = { path = "crates/media/swscale" }
neo-media-ffmpeg = { path = "crates/media/ffmpeg" }
neoutl-schema = { path = "crates/core/schema" }
neoutl-sdk = { path = "sdk/neoutl/0.8.7/rust" }
bytemuck = "1"
half = "2"
serde = "1"
serde_yaml = "0.9"
serde_json = "1"
toml = "1"
rust-i18n = "4"
ureq = { version = "3", features = ["json", "_tls"] }
zip = "8"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
wgpu = "30"
wgpu-hal = "30"
wgpu_text = "30"
mlua = { version = "0.12", default-features = false, features = ["vendored", "send"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
arc-swap = "1"
libloading = "0.9"

[dependencies]
neoutl-shared-abi.workspace = true
neoutl-color.workspace = true
bytemuck.workspace = true
half.workspace = true
neoutl-object-api.workspace = true
neoutl-effect-api.workspace = true
neoutl-effect-lua.workspace = true
neoutl-lua-runtime.workspace = true
neoutl-easing-api.workspace = true
neoutl-expression-api.workspace = true
neoutl-media-api.workspace = true
neoutl-media-runtime.workspace = true
neoutl-mlt-api.workspace = true
neoutl-easing-standard.workspace = true
neoutl-sdk.workspace = true
neoutl-schema.workspace = true
prost.workspace = true
prost-types.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
libloading.workspace = true
arc-swap.workspace = true
notify = "8"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-wav", "symphonia-mp3", "symphonia-vorbis", "symphonia-flac", "symphonia-aac", "symphonia-isomp4"] }
neo-media-ffmpeg.workspace = true
self-replace = "1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic"] }
semver = "1"
tempfile = "3"
wgpu.workspace = true
wgpu_text.workspace = true
font-kit = "0.14"
tokio.workspace = true
shipyard = "0.11"
rfd = "0.17"
pollster = "1"
egui = "0.36"
egui-wgpu = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.36", features = ["svg"] }
egui_taffy = "0.14"
egui_material_icons = "0.8"
egui_code_editor = "0.4"
kurbo = "0.13"
egui-elegance = "0.16"
rust-i18n.workspace = true
ureq.workspace = true
zip.workspace = true
egui-system-fonts = "0.36"
cxx = "1"
maolan-host-adapter.workspace = true

[dev-dependencies]

[build-dependencies]
neoutl-object-shader-build.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
wgpu-hal = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu-hal = { workspace = true, features = ["dx12"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = false
debug = 1
