[workspace]
members = [
    ".",
    "crates/neoutl-shared-abi",
    "crates/neoutl-color",
    "crates/neoutl-object-api",
    "crates/neoutl-effect-api",
    "crates/neoutl-effect-lua",
    "crates/neoutl-lua-runtime",
    "crates/neoutl-easing-api",
    "crates/easings/neoutl-easing-standard",
    "crates/objects/*",
    "crates/effects/*",
    "crates/neoutl-media-api",
    "crates/media/symphonia-decoder",
    "crates/media/gpuvideo-decoder",
    "crates/media/image-decoder",
    "crates/media/gpuvideo-encoder",
    "crates/media/gstreamer-encoder",
    "crates/neo-media-core",
    "crates/neo-media-cache",
    "crates/neo-media-transfer-vaapi",
    "crates/neo-media-support",
    "crates/neo-media-ffmpeg",
    "crates/neoutl-effect-shader-build",
    "crates/neoutl-object-shader-build",
    "crates/xtask",
    "crates/carla-host-sys",
]
exclude = ["neoutl-wgpu"]
resolver = "2"

[workspace.dependencies]
carla-host-sys = { path = "crates/carla-host-sys" }
neoutl-shared-abi = { path = "crates/neoutl-shared-abi" }
neoutl-color = { path = "crates/neoutl-color" }
bytemuck = "1"
half = "2"
neoutl-object-api = { path = "crates/neoutl-object-api" }
neoutl-effect-api = { path = "crates/neoutl-effect-api" }
neoutl-effect-lua = { path = "crates/neoutl-effect-lua" }
neoutl-lua-runtime = { path = "crates/neoutl-lua-runtime" }
neoutl-easing-api = { path = "crates/neoutl-easing-api" }
neoutl-media-api = { path = "crates/neoutl-media-api" }
neoutl-easing-standard = { path = "crates/easings/neoutl-easing-standard" }
neoutl-effect-shader-build = { path = "crates/neoutl-effect-shader-build" }
neoutl-object-shader-build = { path = "crates/neoutl-object-shader-build" }
toml = "1"
serde_json = "1"
rust-i18n = "4"
ureq = { version = "3", features = ["json", "_tls"] }
zip = "8"

[package]
name = "NeoUtl"
version = "0.5.0"
edition = "2024"

[dependencies]
neoutl-shared-abi.workspace = true
neoutl-color.workspace = true
bytemuck.workspace = true
half.workspace = true
neoutl-object-api.workspace = true
neoutl-effect-api.workspace = true
neoutl-effect-lua.workspace = true
neoutl-lua-runtime.workspace = true
neoutl-easing-api.workspace = true
neoutl-media-api.workspace = true
neoutl-easing-standard.workspace = true
toml.workspace = true
serde_json.workspace = true
libloading = "0.9"
arc-swap = "1"
notify = "8"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-wav", "symphonia-mp3", "symphonia-vorbis", "symphonia-flac", "symphonia-aac", "symphonia-isomp4"] }
neoutl-media-gpuvideo-decoder = { path = "crates/media/gpuvideo-decoder" }
neo-media-ffmpeg = { path = "crates/neo-media-ffmpeg" }
neoutl-media-gpuvideo-encoder = { path = "crates/media/gpuvideo-encoder" }
neoutl-media-gstreamer-encoder = { path = "crates/media/gstreamer-encoder" }
carla-host-sys.workspace = true
self-replace = "1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic"] }
semver = "1"
tempfile = "3"
wgpu = "29"
wgpu_text = "29"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
shipyard = "0.11"
rust-yaml = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
pollster = "1"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
winit = "0.30"
egui_extras = "0.35"
egui_material_icons = "0.7"
egui_code_editor = "0.3"
egui_plot = "0.36"
egui-elegance = "0.14"
rust-i18n = "4"
ureq = { version = "3", features = ["json", "_tls"] }
zip = "8"
egui_dock = "0.20"
egui-system-fonts = "0.35"

[dev-dependencies]

[build-dependencies]
neoutl-object-shader-build.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpu-video = { version = "0.4", features = ["wgpu"] }
ash = "0.38"
wgpu-hal = { version = "29", features = ["vulkan"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = false
debug = 1

[patch.crates-io]
wgpu = { path = "neoutl-wgpu/wgpu" }
wgpu-core = { path = "neoutl-wgpu/wgpu-core" }
wgpu-hal = { path = "neoutl-wgpu/wgpu-hal" }