name: ビルド

on:
  push:
    tags:
      - "*"
  pull_request:

permissions:
  contents: read
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"

jobs:
  build:
    name: ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux(x86_64)
            artifact_name: neoutl-linux-x86_64
            binary_name: NeoUtl
            install_cmd: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config clang cmake ninja-build mold libxkbcommon-dev libwayland-dev libegl1-mesa-dev libudev-dev libasound2-dev libfontconfig1-dev libfreetype6-dev libexpat1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          - os: ubuntu-24.04-arm
            os_name: Linux(ARM64)
            artifact_name: neoutl-linux-arm64
            binary_name: NeoUtl
            install_cmd: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config clang cmake ninja-build mold libxkbcommon-dev libwayland-dev libegl1-mesa-dev libudev-dev libasound2-dev libfontconfig1-dev libfreetype6-dev libexpat1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          - os: macos-latest
            os_name: macOS(Apple Silicon)
            artifact_name: neoutl-macos-aarch64
            binary_name: NeoUtl
            install_cmd: brew update && brew install gstreamer
          - os: macos-26-intel
            os_name: macOS(Intel)
            artifact_name: neoutl-macos-x86_64
            binary_name: NeoUtl
            install_cmd: brew update && brew install gstreamer
          - os: windows-latest
            os_name: Windows(x86_64)
            artifact_name: neoutl-windows-x86_64
            binary_name: NeoUtl.exe
            rust_target: x86_64-pc-windows-msvc
            vcpkg_triplet: x64-windows
          - os: windows-11-arm
            os_name: Windows(ARM64)
            artifact_name: neoutl-windows-arm64
            binary_name: NeoUtl.exe
            rust_target: aarch64-pc-windows-msvc
            vcpkg_triplet: arm64-windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: ネイティブ依存関係インストール(Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.install_cmd }}

      - name: NuGet GitHub Packagesソース登録(Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name GitHub `
            --username "${{ github.repository_owner }}" `
            --password "${{ secrets.GITHUB_TOKEN }}" `
            --store-password-in-clear-text

      - name: vcpkgセットアップ(Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      - name: vcpkg経由GStreamerインストール(Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install --triplet ${{ matrix.vcpkg_triplet }}
          echo "VCPKG_INSTALLED=${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}" >> $env:GITHUB_ENV

      - name: pkg-config導入(Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          $pkgConfigDir = "C:\ProgramData\chocolatey\lib\pkgconfiglite\tools\pkg-config-lite-0.28-1\bin"
          echo $pkgConfigDir >> $env:GITHUB_PATH

      - name: Rustツールチェーンセットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: ビルド(Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PKG_CONFIG: pkg-config
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask build --release

      - name: ビルド(Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PKG_CONFIG_PATH: ${{ env.VCPKG_INSTALLED }}/lib/pkgconfig
          PKG_CONFIG: pkg-config.exe
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask build --release

      - name: 成果物収集(Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/package
          cp target/release/${{ matrix.binary_name }} dist/package/
          cp target/release/vst3-host-helper dist/package/
          cp assets/icon.svg dist/package/
          cat > dist/package/NeoUtl.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NeoUtl
          Exec=NeoUtl
          Icon=icon.svg
          StartupWMClass=NeoUtl
          Terminal=false
          Categories=AudioVideo;Graphics;
          EOF
          [ -d target/release/objects ] && cp -r target/release/objects dist/package/
          [ -d target/release/effects ] && cp -r target/release/effects dist/package/
          cd dist/package
          zip -r ../${{ matrix.artifact_name }}.zip .

      - name: .appバンドル作成・パッケージング(macOS Homebrew)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          APP_DIR="dist/NeoUtl.app"
          FRAMEWORKS_DIR="$APP_DIR/Contents/Frameworks"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$FRAMEWORKS_DIR"
          mkdir -p "$APP_DIR/Contents/Resources/gstreamer-1.0"

          cp target/release/${{ matrix.binary_name }} "$APP_DIR/Contents/MacOS/"
          cp target/release/vst3-host-helper "$APP_DIR/Contents/MacOS/"
          cp assets/icon.svg "$APP_DIR/Contents/Resources/"
          [ -d target/release/objects ] && cp -r target/release/objects "$APP_DIR/Contents/Resources/"
          [ -d target/release/effects ] && cp -r target/release/effects "$APP_DIR/Contents/Resources/"

          BREW_GST_PLUGINS="$(brew --prefix gstreamer)/lib/gstreamer-1.0"
          PLUGIN_DIRS=()
          [ -d "$BREW_GST_PLUGINS" ] && PLUGIN_DIRS+=("$BREW_GST_PLUGINS")
          if [ "${#PLUGIN_DIRS[@]}" -eq 0 ]; then
            echo "エラー: GStreamerプラグインディレクトリが見つかりません" >&2
            exit 1
          fi
          PLUGIN_COUNT=$(find "${PLUGIN_DIRS[@]}" -type f \( -name "*.so" -o -name "*.dylib" \) 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PLUGIN_COUNT" -eq 0 ]; then
            echo "エラー: GStreamerプラグインが0件です" >&2
            exit 1
          fi
          for plugin_dir in "${PLUGIN_DIRS[@]}"; do
            find "$plugin_dir" -name "*.so" -exec cp {} "$APP_DIR/Contents/Resources/gstreamer-1.0/" \;
            find "$plugin_dir" -name "*.dylib" -exec cp {} "$APP_DIR/Contents/Resources/gstreamer-1.0/" \;
          done

          EXCLUDE_PLUGINS="libgstnice.dylib libgstpython.dylib libgstgtk.dylib libgstgtk4.dylib libgstges.dylib libgstvalidategtk.dylib libgstvalidategapplication.dylib libgstvalidatessim.dylib libgstvalidatefaultinjection.dylib libgstvalidatetracer.dylib libgstdecklink.dylib libgstndi.dylib libgstjack.dylib libgstwhisper.dylib libgstdeepgram.dylib libgstelevenlabs.dylib libgstspeechmatics.dylib libgstdemucs.dylib libgsttensordecoders.dylib libgstspotify.dylib libgstrtmp.dylib libgstrtmp2.dylib libgstrtsp.dylib libgstrtspclientsink.dylib libgstsrt.dylib libgstsctp.dylib libgstdtls.dylib libgstsrtp.dylib libgstrist.dylib libgstwebrtc.dylib libgstwebrtchttp.dylib libgstshm.dylib libgstaws.dylib libgsticecast.dylib libgsthls.dylib libgsthlssink3.dylib libgsthlsmultivariantsink.dylib libgstdash.dylib libgstmse.dylib libgstreqwest.dylib libgstquinn.dylib libgstraptorq.dylib libgstunixfd.dylib libgstipcpipeline.dylib libgstthreadshare.dylib libgstnetsim.dylib libgstcurl.dylib libgstsoup.dylib libgstrfbsrc.dylib libgstvmnc.dylib"
          for name in $EXCLUDE_PLUGINS; do
            rm -f "$APP_DIR/Contents/Resources/gstreamer-1.0/$name"
          done

          relink() {
            local target="$1"
            chmod +w "$target"
            otool -L "$target" | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                /opt/homebrew/*|/usr/local/*)
                  local base
                  base="$(basename "$dep")"
                  local dest="$FRAMEWORKS_DIR/$base"
                  if [ ! -e "$dep" ]; then
                    echo "警告: macOS依存ライブラリが見つかりません: $dep" >&2
                  elif [ ! -f "$dest" ]; then
                    cp -L "$dep" "$dest"
                    chmod +w "$dest"
                    install_name_tool -id "@rpath/$base" "$dest"
                    relink "$dest"
                    install_name_tool -change "$dep" "@rpath/$base" "$target"
                  else
                    install_name_tool -change "$dep" "@rpath/$base" "$target"
                  fi
                  ;;
              esac
            done
          }

          relink "$APP_DIR/Contents/MacOS/${{ matrix.binary_name }}"
          relink "$APP_DIR/Contents/MacOS/vst3-host-helper"
          find "$APP_DIR/Contents/Resources/gstreamer-1.0" -type f -name "*.dylib" -print0 \
            | while IFS= read -r -d '' plugin; do relink "$plugin"; done

          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_DIR/Contents/MacOS/${{ matrix.binary_name }}"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_DIR/Contents/MacOS/vst3-host-helper"

          FRAMEWORK_COUNT=$(find "$FRAMEWORKS_DIR" -type f | wc -l | tr -d ' ')
          if [ "$FRAMEWORK_COUNT" -eq 0 ]; then
            echo "エラー: Frameworksが0件です" >&2
            exit 1
          fi

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>NeoUtl</string>
            <key>CFBundleExecutable</key>
            <string>NeoUtl</string>
            <key>CFBundleIdentifier</key>
            <string>org.codeberg.taisho-guy.NeoUtl</string>
            <key>CFBundleVersion</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>icon.svg</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF

          find "$APP_DIR/Contents/Frameworks" -type f -exec codesign --force --sign - {} \;
          find "$APP_DIR/Contents/Resources/gstreamer-1.0" -type f -exec codesign --force --sign - {} \;
          [ -d "$APP_DIR/Contents/Resources/objects" ] && find "$APP_DIR/Contents/Resources/objects" -type f -exec codesign --force --sign - {} \;
          [ -d "$APP_DIR/Contents/Resources/effects" ] && find "$APP_DIR/Contents/Resources/effects" -type f -exec codesign --force --sign - {} \;
          codesign --force --sign - "$APP_DIR/Contents/MacOS/vst3-host-helper"
          codesign --force --sign - "$APP_DIR/Contents/MacOS/${{ matrix.binary_name }}"

          cd dist
          zip -r ${{ matrix.artifact_name }}.zip NeoUtl.app

      - name: GStreamer収集・パッケージング(Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          New-Item -ItemType Directory -Force -Path dist/package/lib/gstreamer-1.0 | Out-Null

          Copy-Item "target/release/${{ matrix.binary_name }}" dist/package/
          Copy-Item "target/release/vst3-host-helper.exe" dist/package/
          Copy-Item "assets/icon.ico" dist/package/
          if (Test-Path "target/release/objects") { Copy-Item -Recurse "target/release/objects" dist/package/ }
          if (Test-Path "target/release/effects") { Copy-Item -Recurse "target/release/effects" dist/package/ }

          $vcpkgRoot = "${{ env.VCPKG_INSTALLED }}"
          $vcpkgBin = "$vcpkgRoot/bin"

          # vcpkgのgstreamerポートはプラグインDLLの実出力先がビルド構成・ポートバージョンで
          # 変動する（bin直下 / bin/gstreamer-1.0 / plugins/gstreamer-1.0 等）。単一パス
          # 決め打ちは実際の出力先と食い違うと「0件コピー」のままErrorAction
          # SilentlyContinueで握り潰され検出漏れとなる（実際に発生した不具合）。
          # そのためvcpkgRoot配下をgst*.dllで再帰探索し、コア共有ライブラリ
          # （gst<name>-1.0-0.dll形式）を除いたものをプラグインとして扱う。
          $allGstDlls = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter "gst*.dll" -ErrorAction SilentlyContinue
          $pluginDlls = $allGstDlls | Where-Object { $_.Name -notmatch '-1\.0-0\.dll$' }

          if ($pluginDlls.Count -eq 0) {
            Write-Error "エラー: GStreamerプラグインDLLが0件です（探索対象: $vcpkgRoot）"
            exit 1
          }

          $pluginDlls |
            Sort-Object FullName -Unique |
            Copy-Item -Destination dist/package/lib/gstreamer-1.0/

          $excludePlugins = @(
            "gstdecklink.dll","gstrtmp.dll","gstrtmp2.dll","gstrtsp.dll","gstsrt.dll",
            "gstsctp.dll","gstdtls.dll","gstsrtp.dll","gstrist.dll","gstwebrtc.dll",
            "gstwebrtcdsp.dll","gsthls.dll","gstsoup.dll","gstrfbsrc.dll","gstvmnc.dll","gstshout2.dll"
          )
          foreach ($name in $excludePlugins) {
            Remove-Item -Force -ErrorAction SilentlyContinue "dist/package/lib/gstreamer-1.0/$name"
          }

          $copiedCount = (Get-ChildItem -Path dist/package/lib/gstreamer-1.0 -Filter "*.dll").Count
          if ($copiedCount -eq 0) {
            Write-Error "エラー: 除外リスト適用後、同梱プラグインDLLが0件です"
            exit 1
          }
          Write-Host "GStreamerプラグイン同梱数: $copiedCount"

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          $objdump = Get-Command llvm-objdump.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin -and -not $objdump) {
            Write-Error "エラー: dumpbin.exe/llvm-objdump.exeが見つかりません。依存DLLを解析できません"
            exit 1
          }

          $packageRoot = (Resolve-Path dist/package).Path
          $searchDlls = Get-ChildItem -Path $vcpkgRoot -Recurse -Filter "*.dll" -File
          $visited = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $queued = [System.Collections.Generic.Queue[System.IO.FileInfo]]::new()

          $roots = @(
            (Get-Item "dist/package/${{ matrix.binary_name }}"),
            (Get-Item "dist/package/vst3-host-helper.exe")
          ) + @(Get-ChildItem -Path "dist/package/lib/gstreamer-1.0" -Filter "*.dll" -File)
          foreach ($root in $roots) { $queued.Enqueue($root) }

          function Is-SystemDll([string]$name) {
            $lower = $name.ToLowerInvariant()
            $system32 = Join-Path $env:windir "System32\$name"
            if (Test-Path $system32) { return $true }
            return $lower.StartsWith("api-ms-win-") -or
              $lower.StartsWith("ext-ms-win-") -or
              @("kernel32.dll","user32.dll","advapi32.dll","ole32.dll","oleaut32.dll",
                "shell32.dll","ws2_32.dll","bcrypt.dll","ntdll.dll","gdi32.dll",
                "winmm.dll","imm32.dll","version.dll","shlwapi.dll","secur32.dll",
                "iphlpapi.dll","setupapi.dll","dwmapi.dll","uxtheme.dll").Contains($lower)
          }

          while ($queued.Count -gt 0) {
            $current = $queued.Dequeue()
            $key = $current.FullName
            if (-not $visited.Add($key)) { continue }

            if ($dumpbin) {
              $deps = & $dumpbin.Source /DEPENDENTS $current.FullName 2>$null |
                ForEach-Object {
                  if ($_ -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$') { $matches[1] }
                }
            } else {
              $deps = & $objdump.Source -p $current.FullName 2>$null |
                ForEach-Object {
                  if ($_ -match '^\s*DLL Name:\s*([^\s]+\.dll)\s*$') { $matches[1] }
                }
            }

            foreach ($name in $deps) {
              $dependency = $searchDlls |
                Where-Object { $_.Name -ieq $name } |
                Select-Object -First 1
              if (-not $dependency) {
                if (Is-SystemDll $name) { continue }
                Write-Error "エラー: 依存DLLを解決できません: $name (from=$($current.Name))"
                exit 1
              }

              $destination = Join-Path $packageRoot $dependency.Name
              if (-not (Test-Path $destination)) {
                Copy-Item $dependency.FullName $destination
              }
              $queued.Enqueue($dependency)
            }
          }

          $runtimeCount = (Get-ChildItem -Path $packageRoot -Filter "*.dll" -File).Count
          Write-Host "依存関係を再帰解決したWindows DLL数: $runtimeCount"

          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.artifact_name }}.zip"

      - name: 成果物アップロード
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Codebergリリース
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Codebergリリース作成
        uses: akkuman/gitea-release-action@v1
        env:
          GITEA_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        with:
          server_url: https://codeberg.org
          token: ${{ secrets.CODEBERG_TOKEN }}
          repository: taisho-guy/NeoUtl
          draft: false
          prerelease: ${{ contains(github.ref_name, 'Unstable') }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ""
          files: |
            dist/neoutl-linux-x86_64/neoutl-linux-x86_64.zip
            dist/neoutl-linux-arm64/neoutl-linux-arm64.zip
            dist/neoutl-macos-aarch64/neoutl-macos-aarch64.zip
            dist/neoutl-macos-x86_64/neoutl-macos-x86_64.zip
            dist/neoutl-windows-x86_64/neoutl-windows-x86_64.zip
            dist/neoutl-windows-arm64/neoutl-windows-arm64.zip
